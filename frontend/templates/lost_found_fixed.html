<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Mate - Lost & Found</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <style>
        .page-header {
            background-color: var(--primary);
            color: var(--primary-foreground);
            padding: 4rem 0;
            margin-bottom: 2rem;
        }
        
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border);
        }
        
        .tab {
            padding: 1rem 2rem;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 500;
            color: var(--muted-foreground);
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        .tab:hover {
            color: var(--primary);
        }
        
        .report-form {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--foreground);
        }
        
        .form-input, .form-textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--background);
            color: var(--foreground);
            font-size: 1rem;
            min-height: 40px;
        }
        
        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .btn {
            background: var(--primary);
            color: var(--primary-foreground);
            border: none;
            padding: 0.75rem 2rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: var(--primary-hover);
        }
        
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        
        .item-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            transition: all 0.2s;
        }
        
        .item-card:hover {
            box-shadow: var(--shadow);
        }
        
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .item-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--foreground);
        }
        
        .item-status {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .status-searching {
            background: #fef3c7;
            color: #92400e;
        }
        
        .status-matched {
            background: #dcfce7;
            color: #166534;
        }
        
        .status-resolved {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .item-details {
            margin-bottom: 1rem;
        }
        
        .detail-row {
            display: flex;
            margin-bottom: 0.5rem;
        }
        
        .detail-label {
            font-weight: 500;
            color: var(--muted-foreground);
            min-width: 120px;
        }
        
        .detail-value {
            color: var(--foreground);
        }
        
        .match-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-top: 1rem;
        }
        
        .match-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 1rem;
        }
        
        .match-score {
            font-weight: 600;
            color: var(--primary);
        }
        
        .match-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }
        
        .btn-secondary {
            background: var(--secondary);
            color: var(--secondary-foreground);
        }
        
        .btn-secondary:hover {
            background: var(--secondary-hover);
        }
        
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--muted-foreground);
        }
        
        .debug-info {
            background: #e3f2fd;
            border: 1px solid #90caf9;
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 1rem;
            font-family: monospace;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    {% include 'partials/navbar.html' %}

    <header class="page-header">
        <div class="container">
            <h1>Lost & Found</h1>
            <p>Report lost items or found items. Our system will automatically match them.</p>
        </div>
    </header>

    <main class="container">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="showTab('report-lost')">Report Lost Item</button>
            <button class="tab" onclick="showTab('report-found')">Report Found Item</button>
            <button class="tab" onclick="showTab('my-reports')">My Reports</button>
            <button class="tab" onclick="showTab('matches')">Matches</button>
        </div>

        <!-- Report Lost Item -->
        <div id="report-lost" class="tab-content">
            <div class="report-form">
                <h2>Report Lost Item</h2>
                <form id="lost-item-form">
                    <div class="form-group">
                        <label class="form-label" for="lost-item-name">Item Name *</label>
                        <input type="text" id="lost-item-name" class="form-input" placeholder="e.g., Black Wallet, Phone, etc." required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="lost-station">Station *</label>
                        <select id="lost-station" class="form-input" required>
                            <option value="">Select Station</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="lost-description">Description</label>
                        <textarea id="lost-description" class="form-textarea" placeholder="Provide details about lost item (color, brand, distinguishing features, etc.)"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="lost-full-name">Your Full Name *</label>
                        <input type="text" id="lost-full-name" class="form-input" placeholder="Your full name" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="lost-contact">Contact Number *</label>
                        <input type="tel" id="lost-contact" class="form-input" placeholder="Your phone number for contact" required>
                    </div>
                    
                    <button type="submit" class="btn">Report Lost Item</button>
                </form>
            </div>
        </div>

        <!-- Report Found Item -->
        <div id="report-found" class="tab-content" style="display: none;">
            <div class="report-form">
                <h2>Report Found Item</h2>
                <form id="found-item-form">
                    <div class="form-group">
                        <label class="form-label" for="found-item-name">Item Name *</label>
                        <input type="text" id="found-item-name" class="form-input" placeholder="e.g., Black Wallet, Phone, etc." required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="found-station">Station *</label>
                        <select id="found-station" class="form-input" required>
                            <option value="">Select Station</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="found-description">Description</label>
                        <textarea id="found-description" class="form-textarea" placeholder="Describe the found item, where it was found, etc."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="found-reporter">Your Name *</label>
                        <input type="text" id="found-reporter" class="form-input" placeholder="Your full name" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="found-contact">Contact Information</label>
                        <input type="text" id="found-contact" class="form-input" placeholder="Phone number or email for the owner to contact you">
                    </div>
                    
                    <button type="submit" class="btn">Report Found Item</button>
                </form>
            </div>
        </div>

        <!-- My Reports -->
        <div id="my-reports" class="tab-content" style="display: none;">
            <div id="my-reports-content">
                <div class="loading">
                    <p>Loading your reports...</p>
                </div>
            </div>
        </div>

        <!-- Matches -->
        <div id="matches" class="tab-content" style="display: none;">
            <div id="matches-content">
                <div class="loading">
                    <p>Loading matches...</p>
                </div>
            </div>
        </div>
    </main>

    {% include 'partials/footer.html' %}

    <script src="{{ url_for('static', path='/js/main.js') }}"></script>
    <script>
        // Get current user from localStorage
        const currentUserEmail = localStorage.getItem('user_email');

        // Check if user is logged in
        if (!currentUserEmail) {
            alert('Please login first to access Lost & Found features.');
            window.location.href = '/';
        }

        // Tab switching
        function showTab(tabName) {
            console.log('Switching to tab:', tabName);
            
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(content => {
                content.style.display = 'none';
            });
            
            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName).style.display = 'block';
            
            // Add active class to clicked tab
            event.target.classList.add('active');
            
            // Load content for tab
            if (tabName === 'my-reports') {
                loadMyReports();
            } else if (tabName === 'matches') {
                loadMatches();
            }
        }

        // Load stations for dropdowns
        async function loadStations() {
            console.log('Loading stations...');
            try {
                const response = await fetch('/api/stations');
                
                if (response.ok) {
                    const stations = await response.json();
                    console.log('Stations loaded:', stations.length, 'stations');
                    
                    // Extract station names from the response
                    const stationNames = stations.map(station => station.name);
                    
                    // Populate both station dropdowns
                    const lostSelect = document.getElementById('lost-station');
                    const foundSelect = document.getElementById('found-station');
                    
                    if (lostSelect && foundSelect) {
                        // Clear existing options except the first one
                        lostSelect.innerHTML = '<option value="">Select Station</option>';
                        foundSelect.innerHTML = '<option value="">Select Station</option>';
                        
                        // Add new options using station names
                        stationNames.forEach(stationName => {
                            const option1 = new Option(stationName, stationName);
                            const option2 = new Option(stationName, stationName);
                            lostSelect.add(option1);
                            foundSelect.add(option2);
                        });
                        
                        console.log('Stations added to dropdowns successfully');
                    } else {
                        console.error('Station dropdowns not found');
                    }
                } else {
                    console.error('Failed to load stations:', response.status);
                }
            } catch (error) {
                console.error('Error loading stations:', error);
            }
        }

        // Report lost item
        async function reportLostItem(event) {
            event.preventDefault();
            
            const itemName = document.getElementById('lost-item-name').value;
            const station = document.getElementById('lost-station').value;
            const description = document.getElementById('lost-description').value;
            const fullName = document.getElementById('lost-full-name').value;
            const contactNumber = document.getElementById('lost-contact').value;
            
            if (!itemName || !station || !fullName || !contactNumber) {
                alert('Please fill in all required fields');
                return;
            }
            
            try {
                const response = await fetch('/report-lost', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentUserEmail,
                        item_name: itemName,
                        station: station,
                        description: description,
                        full_name: fullName,
                        contact_number: contactNumber
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    showMessage('success', result.message);
                    
                    // Reset form
                    document.getElementById('lost-item-form').reset();
                    
                    // Reload reports if on that tab
                    if (document.getElementById('my-reports').style.display !== 'none') {
                        loadMyReports();
                    }
                } else {
                    const error = await response.json();
                    showMessage('error', error.detail || 'Failed to report lost item');
                }
            } catch (error) {
                showMessage('error', 'Failed to report lost item. Please try again.');
            }
        }

        // Report found item
        async function reportFoundItem(event) {
            event.preventDefault();
            
            const itemName = document.getElementById('found-item-name').value;
            const station = document.getElementById('found-station').value;
            const description = document.getElementById('found-description').value;
            const reporter = document.getElementById('found-reporter').value;
            const contact = document.getElementById('found-contact').value;
            
            if (!itemName || !station || !reporter) {
                alert('Please fill in all required fields');
                return;
            }
            
            try {
                const response = await fetch('/report-found', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        item_name: itemName,
                        station: station,
                        description: description,
                        reported_by: reporter,
                        contact_info: contact
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    showMessage('success', result.message);
                    
                    // Reset form
                    document.getElementById('found-item-form').reset();
                    
                    // Reload matches if on that tab
                    if (document.getElementById('matches').style.display !== 'none') {
                        loadMatches();
                    }
                } else {
                    const error = await response.json();
                    showMessage('error', error.detail || 'Failed to report found item');
                }
            } catch (error) {
                showMessage('error', 'Failed to report found item. Please try again.');
            }
        }

        // Load my reports
        async function loadMyReports() {
            try {
                const response = await fetch(`/my-reports/${currentUserEmail}`);
                
                if (response.ok) {
                    const reports = await response.json();
                    displayReports(reports);
                } else {
                    const error = await response.json();
                    showMessage('error', error.detail || 'Failed to load reports');
                }
            } catch (error) {
                showMessage('error', 'Failed to load reports. Please refresh the page.');
            }
        }

        // Load matches
        async function loadMatches() {
            try {
                const response = await fetch(`/matches/${currentUserEmail}`);
                
                if (response.ok) {
                    const matches = await response.json();
                    displayMatches(matches);
                } else {
                    const error = await response.json();
                    showMessage('error', error.detail || 'Failed to load matches');
                }
            } catch (error) {
                showMessage('error', 'Failed to load matches. Please refresh the page.');
            }
        }

        // Display reports
        function displayReports(reports) {
            const container = document.getElementById('my-reports-content');
            
            if (reports.length === 0) {
                container.innerHTML = `
                    <div class="loading">
                        <p>You haven't reported any lost items yet.</p>
                    </div>
                `;
                return;
            }
            
            const reportsHTML = reports.map(report => {
                const statusClass = getStatusClass(report.status);
                const createdDate = new Date(report.created_at).toLocaleDateString('en-IN', {
                    year: 'numeric', month: 'short', day: 'numeric'
                });
                
                return `
                    <div class="item-card">
                        <div class="item-header">
                            <h3 class="item-title">${report.item_name}</h3>
                            <span class="item-status ${statusClass}">${report.status.toUpperCase()}</span>
                        </div>
                        <div class="item-details">
                            <div class="detail-row">
                                <span class="detail-label">Station:</span>
                                <span class="detail-value">${report.station}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Reported:</span>
                                <span class="detail-value">${createdDate}</span>
                            </div>
                            ${report.full_name ? `
                                <div class="detail-row">
                                    <span class="detail-label">Your Name:</span>
                                    <span class="detail-value">${report.full_name}</span>
                                </div>
                            ` : ''}
                            ${report.contact_number ? `
                                <div class="detail-row">
                                    <span class="detail-label">Contact:</span>
                                    <span class="detail-value">${report.contact_number}</span>
                                </div>
                            ` : ''}
                            ${report.description ? `
                                <div class="detail-row">
                                    <span class="detail-label">Description:</span>
                                    <span class="detail-value">${report.description}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = reportsHTML;
        }

        // Display matches
        function displayMatches(matches) {
            const container = document.getElementById('matches-content');
            
            if (matches.length === 0) {
                container.innerHTML = `
                    <div class="loading">
                        <p>No matches found yet. Our system is continuously searching for matches.</p>
                    </div>
                `;
                return;
            }
            
            const matchesHTML = matches.map(match => {
                const createdDate = new Date(match.created_at).toLocaleDateString('en-IN', {
                    year: 'numeric', month: 'short', day: 'numeric'
                });
                
                return `
                    <div class="match-section">
                        <h4>Match Score: <span class="match-score">${match.match_score.toFixed(1)}%</span></h4>
                        
                        <div class="match-item">
                            <h5>Your Lost Item:</h5>
                            <p><strong>${match.lost_item.item_name}</strong></p>
                            <p>Station: ${match.lost_item.station}</p>
                            <p>Status: ${match.lost_item.status}</p>
                            
                            <h5>Matching Found Item:</h5>
                            <p><strong>${match.found_item.item_name}</strong></p>
                            <p>Station: ${match.found_item.station}</p>
                            <p>Found by: ${match.found_item.reported_by}</p>
                            ${match.found_item.contact_info ? `<p>Contact: ${match.found_item.contact_info}</p>` : ''}
                            
                            <p><small>Matched on: ${createdDate}</small></p>
                        </div>
                        
                        <div class="match-actions">
                            ${match.status === 'pending' ? `
                                <button class="btn btn-small" onclick="acceptMatch('${match.id}')">Accept Match</button>
                                <button class="btn btn-secondary btn-small" onclick="rejectMatch('${match.id}')">Reject Match</button>
                            ` : ''}
                            ${match.status === 'accepted' ? '<span class="item-status status-resolved">ACCEPTED</span>' : ''}
                            ${match.status === 'rejected' ? '<span class="item-status status-searching">REJECTED</span>' : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = matchesHTML;
        }

        // Accept match
        async function acceptMatch(matchId) {
            try {
                const response = await fetch(`/accept-match/${matchId}`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    const result = await response.json();
                    showMessage('success', result.message);
                    loadMatches(); // Reload matches
                } else {
                    const error = await response.json();
                    showMessage('error', error.detail || 'Failed to accept match');
                }
            } catch (error) {
                showMessage('error', 'Failed to accept match. Please try again.');
            }
        }

        // Reject match
        async function rejectMatch(matchId) {
            try {
                const response = await fetch(`/reject-match/${matchId}`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    const result = await response.json();
                    showMessage('success', result.message);
                    loadMatches(); // Reload matches
                } else {
                    const error = await response.json();
                    showMessage('error', error.detail || 'Failed to reject match');
                }
            } catch (error) {
                showMessage('error', 'Failed to reject match. Please try again.');
            }
        }

        // Get status class
        function getStatusClass(status) {
            switch (status) {
                case 'searching': return 'status-searching';
                case 'matched': return 'status-matched';
                case 'resolved': return 'status-resolved';
                default: return 'status-searching';
            }
        }

        // Show message
        function showMessage(type, message) {
            // Remove existing messages
            const existingMessages = document.querySelectorAll('.success-message, .error-message');
            existingMessages.forEach(msg => msg.remove());
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `${type}-message`;
            messageDiv.textContent = message;
            
            // Insert after the tabs
            const tabsContainer = document.querySelector('.tabs');
            tabsContainer.parentNode.insertBefore(messageDiv, tabsContainer.nextSibling);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Lost & Found system initialized');
            
            // Load stations
            loadStations();
            
            // Add form submit listeners
            document.getElementById('lost-item-form').addEventListener('submit', reportLostItem);
            document.getElementById('found-item-form').addEventListener('submit', reportFoundItem);
            
            console.log('Lost & Found system ready');
        });
    </script>
</body>
</html>
