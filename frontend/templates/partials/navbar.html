<script>
(() => {
    window.logout = async function logout() {
        try {
            await fetch('/logout', { method: 'POST' });
        } catch (error) {
            console.error('Logout request failed:', error);
        } finally {
            localStorage.removeItem('user');
            localStorage.removeItem('user_id');
            localStorage.removeItem('user_email');
            localStorage.removeItem('user_name');
            localStorage.removeItem('user_type');
            localStorage.removeItem('auth_token');
            sessionStorage.removeItem('user');

            window.location.href = '/';
        }
    };

    const applyRoleNavigation = () => {
        const currentUserType = localStorage.getItem('auth_token')
            ? (localStorage.getItem('user_type') || '').trim().toLowerCase()
            : '';
        const currentPath = window.location.pathname;
        const isAdminOnlyPath =
            currentPath === '/admin' ||
            currentPath.startsWith('/admin/') ||
            currentPath === '/analytics' ||
            currentPath.startsWith('/analytics/');

        const toggleVisibility = (selector, shouldShow) => {
            document.querySelectorAll(selector).forEach((element) => {
                element.classList.toggle('hidden', !shouldShow);
            });
        };

        if (currentUserType === 'admin') {
            toggleVisibility('[data-role="user-only"]', false);
            toggleVisibility('[data-role="admin-only"]', true);

            if (!isAdminOnlyPath) {
                window.location.replace('/admin');
                return;
            }
        } else if (currentUserType === 'user') {
            toggleVisibility('[data-role="user-only"]', true);
            toggleVisibility('[data-role="admin-only"]', false);

            if (isAdminOnlyPath) {
                window.location.replace('/home');
                return;
            }
        } else {
            toggleVisibility('[data-role="admin-only"]', false);
        }

        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');

        if (mobileMenuToggle && mobileMenu) {
            mobileMenuToggle.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyRoleNavigation);
    } else {
        applyRoleNavigation();
    }
})();
</script>
